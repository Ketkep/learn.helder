<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <style>
    .bt-body { fill: var(--cover-b); stroke: var(--on-cover); stroke-width: 6; }
    .bt-tip { fill: var(--on-cover); }
    .bt-bar { fill: var(--on-cover); transform-box: fill-box; transform-origin: 0 50%; }
    @media (prefers-reduced-motion: no-preference) {
      :is(a, .head-art):is(:hover, :focus-visible, .is-playing) .bt-bar { animation: bt-drain 2.4s ease-in-out infinite alternate; }
    }
    /* The charge drains and returns */
    @keyframes bt-drain { 0% { transform: scaleX(1); } 100% { transform: scaleX(0.2); } }
  </style>

  <g>
    <rect class="bt-body" x="80" y="100" width="220" height="100" rx="14"/>
    <rect class="bt-tip" x="304" y="130" width="18" height="40" rx="4"/>
    <rect class="bt-bar" x="96" y="116" width="188" height="68" rx="6"/>
  </g>
  <circle class="knob" cx="200" cy="262" r="14"/>
</svg>
