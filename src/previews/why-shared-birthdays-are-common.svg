<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <style>
    .bd-line { fill: none; stroke: var(--on-cover); stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
    .bd-fill { fill: var(--on-cover); }
    .bd-soft { opacity: 0.25; }
    @media (prefers-reduced-motion: no-preference) {
      :is(a, .head-art):is(:hover, :focus-visible, .is-playing) .bd-hit { animation: bd-hit 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    }
    /* Two guests land on the same day */
    @keyframes bd-hit { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.3); } }
  </style>

  <g>
    <rect class="bd-line" x="85" y="60" width="230" height="150" rx="14"/>
    <path class="bd-line" d="M85 100 H315"/>
    <circle class="bd-fill bd-soft" cx="125" cy="135" r="9"/>
    <circle class="bd-fill bd-soft" cx="170" cy="135" r="9"/>
    <circle class="bd-fill bd-soft" cx="215" cy="135" r="9"/>
    <circle class="bd-fill bd-soft" cx="260" cy="135" r="9"/>
    <circle class="bd-fill bd-soft" cx="125" cy="180" r="9"/>
    <circle class="bd-fill bd-soft" cx="215" cy="180" r="9"/>
    <circle class="bd-fill bd-hit" cx="170" cy="180" r="13"/>
    <circle class="bd-fill bd-hit" cx="260" cy="180" r="13"/>
  </g>
  <circle class="knob" cx="200" cy="268" r="14"/>
</svg>
