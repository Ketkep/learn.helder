<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <style>
    .rb-arc { fill: none; stroke: var(--on-cover); stroke-width: 10; stroke-linecap: round; }
    .rb-a { stroke-dasharray: 330; stroke-dashoffset: 0; }
    .rb-ground { stroke: var(--on-cover); stroke-width: 6; stroke-linecap: round; }
    @media (prefers-reduced-motion: no-preference) {
      :is(a, .head-art):is(:hover, :focus-visible, .is-playing) .rb-a { animation: rb-draw 2.2s ease-in-out infinite alternate; }
    }
    /* The bow draws itself across the sky */
    @keyframes rb-draw { 0% { stroke-dashoffset: 330; } 100% { stroke-dashoffset: 0; } }
  </style>

  <g>
    <path class="rb-arc rb-a" d="M80 200A120 120 0 0 1 320 200"/>
    <path class="rb-arc rb-a" d="M106 200A94 94 0 0 1 294 200" opacity="0.7"/>
    <path class="rb-arc rb-a" d="M132 200A68 68 0 0 1 268 200" opacity="0.45"/>
    <line class="rb-ground" x1="60" y1="204" x2="340" y2="204"/>
  </g>
  <circle class="knob" cx="200" cy="262" r="14"/>
</svg>
