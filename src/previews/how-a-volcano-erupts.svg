<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <style>
    .vo-cone { fill: var(--cover-b); stroke: var(--on-cover); stroke-width: 6; stroke-linejoin: round; }
    .vo-puff { fill: var(--on-cover); transform-box: fill-box; transform-origin: 50% 100%; }
    @media (prefers-reduced-motion: no-preference) {
      :is(a, .head-art):is(:hover, :focus-visible, .is-playing) .vo-puff { animation: vo-rise 1.8s ease-out infinite; }
    }
    /* Ash puffs rise and fade */
    @keyframes vo-rise { 0% { transform: translateY(20px) scale(0.5); opacity: 1; } 100% { transform: translateY(-60px) scale(1.3); opacity: 0; } }
  </style>

  <g>
    <path class="vo-cone" d="M90 220L170 110H230L310 220Z"/>
    <circle class="vo-puff" cx="200" cy="96" r="20"/>
    <circle class="vo-puff" cx="178" cy="76" r="14"/>
    <circle class="vo-puff" cx="224" cy="70" r="16"/>
  </g>
  <circle class="knob" cx="200" cy="262" r="14"/>
</svg>
