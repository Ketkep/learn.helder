<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <style>
    .hc-disc { fill: var(--cover-b); stroke: var(--on-cover); stroke-width: 4; }
    .hc-in { fill: var(--cover); stroke: var(--on-cover); stroke-width: 4; }
    .hc-t { fill: var(--on-cover); font: 800 22px var(--font-body); }
    .hc-turn { transform-origin: 200px 140px; }
    @media (prefers-reduced-motion: no-preference) {
      :is(a, .head-art):is(:hover, :focus-visible, .is-playing) .hc-turn { animation: hc-turn 4s steps(6, end) infinite; }
    }
    /* The inner wheel turns one letter at a time */
    @keyframes hc-turn { to { transform: rotate(-60deg); } }
  </style>

  <g>
    <circle class="hc-disc" cx="200" cy="140" r="102"/>
    <circle class="hc-in" cx="200" cy="140" r="64"/>
    <g class="hc-t" text-anchor="middle">
      <text x="200" y="64">A</text><text x="276" y="148">G</text><text x="200" y="228">M</text><text x="124" y="148">S</text>
    </g>
    <g class="hc-turn"><g class="hc-t" text-anchor="middle">
      <text x="200" y="116">D</text><text x="236" y="146">J</text><text x="200" y="176">P</text><text x="164" y="146">V</text>
    </g></g>
  </g>
  <circle class="knob" cx="200" cy="268" r="14"/>
</svg>
