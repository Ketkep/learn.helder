<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <style>
    .se-card { fill: var(--cover-b); stroke: var(--on-cover); stroke-width: 4; }
    .se-line { fill: none; stroke: var(--on-cover); stroke-width: 5; stroke-linecap: round; }
    .se-dot { fill: var(--on-cover); }
    @media (prefers-reduced-motion: no-preference) {
      :is(a, .head-art):is(:hover, :focus-visible, .is-playing) .se-line { stroke-dasharray: 8 10; animation: se-walk 1.4s linear infinite; }
    }
    /* The crawler walks along the links */
    @keyframes se-walk { to { stroke-dashoffset: -36; } }
  </style>

  <g>
    <rect class="se-card" x="90" y="70" width="220" height="130" rx="10"/>
    <circle class="se-dot" cx="130" cy="110" r="12"/>
    <circle class="se-dot" cx="270" cy="110" r="12"/>
    <circle class="se-dot" cx="200" cy="168" r="12"/>
    <path class="se-line" d="M142 110H258M136 120L190 160M264 120L210 160"/>
  </g>
  <circle class="knob" cx="200" cy="262" r="14"/>
</svg>
