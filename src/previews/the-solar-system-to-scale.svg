<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <style>
    .ss-sun { fill: var(--cover-b); stroke: var(--on-cover); stroke-width: 4; }
    .ss-road { stroke: var(--on-cover); stroke-width: 4; stroke-dasharray: 6 8; stroke-linecap: round; }
    .ss-dot { fill: var(--on-cover); }
    .ss-you { fill: var(--on-cover); }
    @media (prefers-reduced-motion: no-preference) {
      :is(a, .head-art):is(:hover, :focus-visible, .is-playing) .ss-you { animation: ss-walk 2.4s ease-in-out infinite alternate; }
    }
    /* A walker goes out along the road */
    @keyframes ss-walk { 0% { transform: translateX(0); } 100% { transform: translateX(200px); } }
  </style>

  <g>
    <circle class="ss-sun" cx="80" cy="130" r="44"/>
    <line class="ss-road" x1="140" y1="130" x2="360" y2="130"/>
    <circle class="ss-dot" cx="160" cy="130" r="4"/><circle class="ss-dot" cx="180" cy="130" r="5"/><circle class="ss-dot" cx="204" cy="130" r="5"/><circle class="ss-dot" cx="226" cy="130" r="4"/><circle class="ss-dot" cx="268" cy="130" r="10"/><circle class="ss-dot" cx="310" cy="130" r="9"/>
    <circle class="ss-you" cx="150" cy="170" r="8"/>
  </g>
  <circle class="knob" cx="200" cy="262" r="14"/>
</svg>
