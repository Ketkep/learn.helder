<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <style>
    .hx-line { fill: none; stroke: var(--on-cover); stroke-width: 8; stroke-linejoin: round; stroke-linecap: round; }
    .hx-one, .hx-two { transform-box: fill-box; transform-origin: center; }
    @media (prefers-reduced-motion: no-preference) {
      :is(a, .head-art):is(:hover, :focus-visible, .is-playing) .hx-one { animation: hx-pop 2.8s ease-in-out infinite; }
      :is(a, .head-art):is(:hover, :focus-visible, .is-playing) .hx-two { animation: hx-pop 2.8s ease-in-out infinite 0.6s; }
    }
    /* The cells swell until their walls meet */
    @keyframes hx-pop { 0%, 100% { transform: scale(0.88); } 50% { transform: scale(1); } }
  </style>

  <g>
    <path class="hx-line" d="M200 78 L242 102 V150 L200 174 L158 150 V102 Z"/>
    <path class="hx-line hx-one" d="M284 126 L326 150 V198 L284 222 L242 198 V150 Z"/>
    <path class="hx-line hx-two" d="M116 126 L158 150 V198 L116 222 L74 198 V150 Z"/>
  </g>
  <circle class="knob" cx="200" cy="268" r="14"/>
</svg>
