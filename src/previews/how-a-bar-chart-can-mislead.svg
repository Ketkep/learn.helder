<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <style>
    .bc2-axis { stroke: var(--on-cover); stroke-width: 8; stroke-linecap: round; }
    .bc2-bar { fill: var(--on-cover); transform-box: fill-box; transform-origin: bottom; }
    .bc2-cut { fill: none; stroke: var(--on-cover); stroke-width: 6; stroke-dasharray: 12 10; }
    @media (prefers-reduced-motion: no-preference) {
      :is(a, .head-art):is(:hover, :focus-visible, .is-playing) .bc2-bar.tall { animation: bc2-grow 2.4s ease-in-out infinite; }
    }
    /* The second bar seems to grow as the bottom of the axis is cut away */
    @keyframes bc2-grow { 0%, 20% { transform: scaleY(1); } 60%, 100% { transform: scaleY(1.7); } }
  </style>

  <g>
    <path class="bc2-axis" d="M90 70 V230 H320"/>
    <rect class="bc2-bar" x="130" y="130" width="60" height="100" rx="4"/>
    <rect class="bc2-bar tall" x="220" y="122" width="60" height="108" rx="4"/>
    <line class="bc2-cut" x1="96" y1="190" x2="316" y2="190"/>
  </g>
  <circle class="knob" cx="200" cy="268" r="14"/>
</svg>
