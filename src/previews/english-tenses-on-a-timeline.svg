<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <!-- Colors come from the cover: .a main shape, .l line, .knob the orange knob -->
  <path class="l" d="M24 204H372" />
  <path class="l" d="M356 190l16 14-16 14" />
  <!-- Past hop (solid) and future hop (dotted) -->
  <path class="l" d="M84 188C96 108 186 108 200 170" />
  <path class="l dash" d="M218 170C234 108 306 108 316 188" />
  <!-- Past stop, future stop -->
  <circle class="a" cx="84" cy="204" r="14" />
  <circle class="l" cx="316" cy="204" r="14" />
  <text x="84" y="246" text-anchor="middle">walked</text>
  <!-- The "now" knob slides to the future on hover, and its label changes with it -->
  <g class="m" style="--dx: 116px">
    <circle class="knob" cx="200" cy="204" r="24" />
    <text class="swap-a" x="200" y="256" text-anchor="middle">walk</text>
    <text class="swap-b" x="200" y="256" text-anchor="middle">will walk</text>
  </g>
</svg>
