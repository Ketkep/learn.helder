<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <style>
    .pe-sunpale { fill: color-mix(in oklab, var(--cover) 62%, #fff3dc); }
    .pe-sunlit { fill: var(--accent); stroke: var(--on-cover); stroke-width: 3; }
    .pe-ground { fill: color-mix(in oklab, var(--cover) 86%, var(--on-cover)); }
    .pe-l { fill: color-mix(in oklab, var(--cover) 22%, var(--on-cover)); }
    .pe-r { fill: color-mix(in oklab, var(--cover) 52%, var(--on-cover)); }
    .pe-t { fill: color-mix(in oklab, var(--cover) 58%, #fff3dc); }
    .pe-riser { fill: color-mix(in oklab, var(--cover) 30%, #fff3dc); }
    .pe-tread { fill: #fff3dc; }
    .pe-tl { fill: color-mix(in oklab, var(--cover) 30%, var(--on-cover)); }
    .pe-tr { fill: color-mix(in oklab, var(--cover) 65%, #fff3dc); }
    .pe-tt { fill: #fff3dc; }
    .pe-door { fill: var(--on-cover); }
    .pe-door-lit { fill: var(--accent); opacity: 0; }
    .pe-ballx, .pe-bally, .pe-balls { transform-box: view-box; }
    .pe-balls { transform-box: fill-box; transform-origin: 50% 50%; }
    @media (prefers-reduced-motion: no-preference) {
      :is(a, .head-art):is(:hover, :focus-visible, .is-playing) .pe-ballx { animation: pe-kx 9.0s linear infinite; }
      :is(a, .head-art):is(:hover, :focus-visible, .is-playing) .pe-bally { animation: pe-ky 9.0s linear infinite; }
      :is(a, .head-art):is(:hover, :focus-visible, .is-playing) .pe-balls { animation: pe-ks 9.0s linear infinite; }
      :is(a, .head-art):is(:hover, :focus-visible, .is-playing) .pe-sunlit { animation: pe-sun 9.0s linear infinite; }
      :is(a, .head-art):is(:hover, :focus-visible, .is-playing) .pe-door-lit { animation: pe-doorlit 9.0s linear infinite; }
    }
    /* The knob climbs the stairs one hop at a time, goes into the temple, and the sun comes up.
       Then the knob bounces back down. Sideways and up-and-down are two animations, so the hops curve. */
    @keyframes pe-kx {
      0% { transform: translateX(0px); }
      6.67% { transform: translateX(0px); }
      12.22% { transform: translateX(-19px); }
      17.78% { transform: translateX(-33px); }
      23.33% { transform: translateX(-47px); }
      28.89% { transform: translateX(-61px); }
      34.44% { transform: translateX(-74px); }
      37.78% { transform: translateX(-82px); }
      71.11% { transform: translateX(-82px); }
      72.22% { transform: translateX(-82px); }
      74.67% { transform: translateX(-61px); }
      77.11% { transform: translateX(-47px); }
      79.56% { transform: translateX(-33px); }
      82% { transform: translateX(-19px); }
      84.44% { transform: translateX(0px); }
      100% { transform: translateX(0px); }
    }
    @keyframes pe-ky {
      0% { transform: translateY(0px); animation-timing-function: linear; }
      6.67% { transform: translateY(0px); animation-timing-function: ease-out; }
      9.17% { transform: translateY(-43.5px); animation-timing-function: ease-in; }
      12.22% { transform: translateY(-29.5px); animation-timing-function: ease-out; }
      14.72% { transform: translateY(-70.5px); animation-timing-function: ease-in; }
      17.78% { transform: translateY(-56.5px); animation-timing-function: ease-out; }
      20.28% { transform: translateY(-97.5px); animation-timing-function: ease-in; }
      23.33% { transform: translateY(-83.5px); animation-timing-function: ease-out; }
      25.83% { transform: translateY(-124.5px); animation-timing-function: ease-in; }
      28.89% { transform: translateY(-110.5px); animation-timing-function: ease-out; }
      31.39% { transform: translateY(-151px); animation-timing-function: ease-in; }
      34.44% { transform: translateY(-137px); animation-timing-function: ease-out; }
      37.78% { transform: translateY(-139px); animation-timing-function: linear; }
      71.11% { transform: translateY(-139px); animation-timing-function: ease-out; }
      72.22% { transform: translateY(-139px); animation-timing-function: ease-out; }
      73.32% { transform: translateY(-148px); animation-timing-function: ease-in; }
      74.67% { transform: translateY(-110.5px); animation-timing-function: ease-out; }
      75.77% { transform: translateY(-119.5px); animation-timing-function: ease-in; }
      77.11% { transform: translateY(-83.5px); animation-timing-function: ease-out; }
      78.21% { transform: translateY(-92.5px); animation-timing-function: ease-in; }
      79.56% { transform: translateY(-56.5px); animation-timing-function: ease-out; }
      80.66% { transform: translateY(-65.5px); animation-timing-function: ease-in; }
      82% { transform: translateY(-29.5px); animation-timing-function: ease-out; }
      83.1% { transform: translateY(-38.5px); animation-timing-function: ease-in; }
      84.44% { transform: translateY(0px); animation-timing-function: ease-out; }
      100% { transform: translateY(0px); animation-timing-function: linear; }
    }
    @keyframes pe-ks {
      0% { transform: scale(1); opacity: 1; }
      34.44% { transform: scale(1); opacity: 1; }
      37.78% { transform: scale(0.25); opacity: 0; }
      71.11% { transform: scale(0.25); opacity: 0; }
      72.44% { transform: scale(1); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes pe-sun {
      0% { transform: translateY(46px); opacity: 0; animation-timing-function: ease-out; }
      38.89% { transform: translateY(46px); opacity: 0; animation-timing-function: ease-out; }
      52.22% { transform: translateY(0px); opacity: 1; animation-timing-function: linear; }
      71.11% { transform: translateY(0px); opacity: 1; animation-timing-function: ease-in; }
      83.33% { transform: translateY(46px); opacity: 0; animation-timing-function: linear; }
      100% { transform: translateY(46px); opacity: 0; animation-timing-function: linear; }
    }
    @keyframes pe-doorlit {
      0% { opacity: 0; }
      37.22% { opacity: 0; }
      39.11% { opacity: 1; }
      71.67% { opacity: 1; }
      73.89% { opacity: 0; }
      100% { opacity: 0; }
    }
  </style>

  <!-- The sun: a pale one at rest, an orange one rises behind the pyramid when played -->
  <circle class="pe-sunpale" cx="200" cy="72" r="50"/>
  <circle class="pe-sunlit" cx="200" cy="72" r="50" opacity="0" transform-origin="200 72"/>

  <!-- The ground, then the terraces from the bottom up -->
  <polygon class="pe-ground" points="200,110 384,202 200,294 16,202"/>
  <polygon class="pe-l" points="40,202 200,282 200,262 40,182"/>
  <polygon class="pe-r" points="360,202 200,282 200,262 360,182"/>
  <polygon class="pe-t" points="200,102 360,182 200,262 40,182"/>
  <polygon class="pe-riser" points="291,236.5 269,247.5 269,227.5 291,216.5"/>
  <polygon class="pe-tread" points="291,216.5 269,227.5 255,220.5 277,209.5"/>
  <polygon class="pe-l" points="68,182 200,248 200,228 68,162"/>
  <polygon class="pe-r" points="332,182 200,248 200,228 332,162"/>
  <polygon class="pe-t" points="200,96 332,162 200,228 68,162"/>
  <polygon class="pe-riser" points="277,209.5 255,220.5 255,200.5 277,189.5"/>
  <polygon class="pe-tread" points="277,189.5 255,200.5 241,193.5 263,182.5"/>
  <polygon class="pe-l" points="96,162 200,214 200,194 96,142"/>
  <polygon class="pe-r" points="304,162 200,214 200,194 304,142"/>
  <polygon class="pe-t" points="200,90 304,142 200,194 96,142"/>
  <polygon class="pe-riser" points="263,182.5 241,193.5 241,173.5 263,162.5"/>
  <polygon class="pe-tread" points="263,162.5 241,173.5 227,166.5 249,155.5"/>
  <polygon class="pe-l" points="124,142 200,180 200,160 124,122"/>
  <polygon class="pe-r" points="276,142 200,180 200,160 276,122"/>
  <polygon class="pe-t" points="200,84 276,122 200,160 124,122"/>
  <polygon class="pe-riser" points="249,155.5 227,166.5 227,146.5 249,135.5"/>
  <polygon class="pe-tread" points="249,135.5 227,146.5 213,139.5 235,128.5"/>
  <polygon class="pe-l" points="152,122 200,146 200,126 152,102"/>
  <polygon class="pe-r" points="248,122 200,146 200,126 248,102"/>
  <polygon class="pe-t" points="200,78 248,102 200,126 152,102"/>
  <polygon class="pe-riser" points="235,128.5 213,139.5 213,119.5 235,108.5"/>
  <polygon class="pe-tread" points="235,108.5 213,119.5 201,113.5 223,102.5"/>
  <polygon class="pe-tl" points="176,102 200,114 200,96 176,84"/>
  <polygon class="pe-tr" points="224,102 200,114 200,96 224,84"/>
  <polygon class="pe-tt" points="200,72 224,84 200,96 176,84"/>
  <polygon class="pe-door" points="217,105.5 207,110.5 207,98.5 217,93.5"/>
  <polygon class="pe-door-lit" points="217,105.5 207,110.5 207,98.5 217,93.5"/>

  <!-- The knob that climbs -->
  <g transform="translate(292 240)">
    <g class="pe-ballx"><g class="pe-bally"><g class="pe-balls"><circle class="knob" cx="0" cy="0" r="8"/></g></g></g>
  </g>

  <text x="14" y="284">Caral, 3000 BC</text>
</svg>
