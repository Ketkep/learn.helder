<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <style>
    .pe-far { fill: color-mix(in oklab, var(--cover) 82%, var(--on-cover)); }
    .pe-near { fill: color-mix(in oklab, var(--cover) 66%, var(--on-cover)); }
    .pe-b1 { fill: color-mix(in oklab, var(--cover) 6%, var(--on-cover)); }
    .pe-b2 { fill: color-mix(in oklab, var(--cover) 26%, var(--on-cover)); }
    .pe-b3 { fill: color-mix(in oklab, var(--cover) 44%, var(--on-cover)); }
    .pe-st { fill: color-mix(in oklab, var(--cover) 36%, white); }
    .pe-hl { fill: #fff; fill-opacity: 0.2; }
    .pe-body { fill: var(--on-cover); }
    .pe-leg { fill: none; stroke: var(--on-cover); stroke-width: 2.6; stroke-linecap: round; }
    .pe-bag { fill: var(--accent); stroke: var(--on-cover); stroke-width: 1.8; }
    .pe-halo { transform-box: fill-box; transform-origin: 50% 50%; }
    .pe-sway, .pe-wing { transform-box: fill-box; }
    .pe-sway { transform-origin: 50% 50%; }
    .pe-wing { transform-origin: 0% 50%; }
    svg text.pe-cap { font-size: 14px; }
    @media (prefers-reduced-motion: no-preference) {
      /* The blocks drop in one after another, bottom tier first, and stay */
      :is(a, .head-art):is(:hover, :focus-visible, .is-playing) .pe-blk { animation: pe-drop 0.5s cubic-bezier(0.3, 1.5, 0.5, 1) both; animation-delay: calc(var(--i) * 0.05s); }
      :is(a, .head-art):is(:hover, :focus-visible, .is-playing) .pe-sunwrap { animation: pe-rise 2.8s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
      :is(a, .head-art):is(:hover, :focus-visible, .is-playing) .pe-halo { animation: pe-spin 14s linear infinite; }
      :is(a, .head-art):is(:hover, :focus-visible, .is-playing) .pe-fly { animation: pe-glide 13s linear infinite; }
      :is(a, .head-art):is(:hover, :focus-visible, .is-playing) .pe-sway { animation: pe-bank 3.4s ease-in-out infinite alternate; }
      /* Once the pyramid stands, people carry loads up the staircase, a step at a time */
      :is(a, .head-art):is(:hover, :focus-visible, .is-playing) .pe-person { animation: pe-climb 5.6s steps(7, end) infinite backwards; animation-delay: calc(3.2s + var(--w) * 1.9s); }
    }
    @keyframes pe-drop {
      from { opacity: 0; transform: translateY(-36px); }
      70% { opacity: 1; }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes pe-rise { from { transform: translateY(130px); } to { transform: translateY(0); } }
    @keyframes pe-spin { to { transform: rotate(360deg); } }
    /* The condor crosses from the left edge to the right edge, then comes round again */
    @keyframes pe-glide { 0% { transform: translate(-230px, 6px); } 100% { transform: translate(310px, -14px); } }
    @keyframes pe-bank { from { transform: rotate(-7deg); } to { transform: rotate(7deg); } }
    @keyframes pe-climb {
      0% { transform: translate(200px, 262px); opacity: 0; }
      8% { opacity: 1; }
      88% { opacity: 1; }
      100% { transform: translate(200px, 122px); opacity: 0; }
    }
  </style>

  <defs><clipPath id="pe-clip"><rect x="0" y="0" width="400" height="262"/></clipPath></defs>
  <!-- The sun rises from behind the mountains (it is drawn first, so they pass in front) -->
  <g class="pe-sunwrap">
    <g class="pe-halo"><circle class="l dash" cx="322" cy="92" r="40"/></g>
    <circle class="knob" cx="322" cy="92" r="27"/>
  </g>

  <!-- An Andean condor glides across the sky -->
  <g clip-path="url(#pe-clip)"><g transform="translate(150 66)"><g class="pe-fly"><g class="pe-sway">
      <g class="pe-wing"><path class="pe-body" d="M3 -2C14 -10 34 -14 58 -6L52 -3L60 0L52 3L58 7L49 6L53 12L44 9C32 6 16 5 3 4Z"/></g>
      <g class="pe-wing" transform="scale(-1 1)"><path class="pe-body" d="M3 -2C14 -10 34 -14 58 -6L52 -3L60 0L52 3L58 7L49 6L53 12L44 9C32 6 16 5 3 4Z"/></g>
      <ellipse class="pe-body" cx="0" cy="3" rx="4.6" ry="9"/>
      <path class="pe-body" d="M-4 10L0 21L4 10Z"/>
      <circle class="pe-body" cx="0" cy="-9" r="3"/>
      <ellipse class="pe-st" cx="0" cy="-4.5" rx="3.6" ry="1.7"/>
    </g></g></g></g>

