<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <style>
    .hq-land { fill: var(--cover-b); stroke: var(--on-cover); stroke-width: 4; }
    .hq-bridge { stroke: var(--on-cover); stroke-width: 8; }
    .hq-dot { fill: var(--on-cover); transform-box: fill-box; transform-origin: 50% 50%; }
    @media (prefers-reduced-motion: no-preference) {
      :is(a, .head-art):is(:hover, :focus-visible, .is-playing) .hq-dot { animation: hq-walk 3.6s steps(1, end) infinite; }
    }
    /* A walker hops from land to land */
    @keyframes hq-walk { 0% { transform: translate(0, 0); } 25% { transform: translate(120px, 0); } 50% { transform: translate(120px, 90px); } 75% { transform: translate(0, 90px); } }
  </style>

  <g>
    <line class="hq-bridge" x1="120" y1="86" x2="120" y2="150"/>
    <line class="hq-bridge" x1="280" y1="86" x2="280" y2="150"/>
    <line class="hq-bridge" x1="150" y1="186" x2="250" y2="186"/>
    <line class="hq-bridge" x1="150" y1="104" x2="250" y2="104"/>
    <ellipse class="hq-land" cx="120" cy="64" rx="44" ry="26"/>
    <ellipse class="hq-land" cx="280" cy="64" rx="44" ry="26"/>
    <ellipse class="hq-land" cx="120" cy="176" rx="44" ry="26"/>
    <ellipse class="hq-land" cx="280" cy="176" rx="44" ry="26"/>
    <circle class="hq-dot" cx="120" cy="64" r="9"/>
  </g>
  <circle class="knob" cx="200" cy="254" r="14"/>
</svg>
