<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <style>
    .th-peg { fill: var(--on-cover); }
    .th-disk { fill: var(--on-cover); }
    .th-top { transform-box: fill-box; }
    @media (prefers-reduced-motion: no-preference) {
      :is(a, .head-art):is(:hover, :focus-visible, .is-playing) .th-top { animation: th-hop 1.8s ease-in-out infinite alternate; }
    }
    /* The top disk hops from the first peg towards the last */
    @keyframes th-hop { 0% { transform: translate(0, 0); } 100% { transform: translate(110px, 28px); } }
  </style>

  <g>
    <rect class="th-peg" x="82" y="60" width="10" height="150" rx="5"/>
    <rect class="th-peg" x="195" y="60" width="10" height="150" rx="5"/>
    <rect class="th-peg" x="308" y="60" width="10" height="150" rx="5"/>
    <rect class="th-peg" x="50" y="208" width="300" height="12" rx="5"/>
    <rect class="th-disk" x="46" y="184" width="82" height="22" rx="7"/>
    <rect class="th-disk" x="58" y="160" width="58" height="22" rx="7"/>
    <rect class="th-disk th-top" x="68" y="136" width="38" height="22" rx="7"/>
  </g>
  <circle class="knob" cx="200" cy="268" r="14"/>
</svg>
