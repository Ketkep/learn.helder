<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <style>
    .te-tube { fill: var(--on-cover); }
    .te-ring { fill: var(--cover-b); }
    .te-star { fill: var(--on-cover); transform-box: fill-box; transform-origin: center; }
    @media (prefers-reduced-motion: no-preference) {
      :is(a, .head-art):is(:hover, :focus-visible, .is-playing) .te-star { animation: te-twinkle 1.1s ease-in-out infinite alternate; }
    }
    /* A far star flickers in the eyepiece */
    @keyframes te-twinkle { 0% { opacity: 0.25; transform: scale(0.7); } 100% { opacity: 1; transform: scale(1.15); } }
  </style>

  <g transform="rotate(-24 200 140)">
    <rect class="te-tube" x="86" y="112" width="190" height="56" rx="8"/>
    <rect class="te-tube" x="268" y="124" width="52" height="32" rx="6"/>
    <rect class="te-ring" x="106" y="112" width="10" height="56"/>
    <rect class="te-ring" x="236" y="112" width="10" height="56"/>
    <rect class="te-tube" x="150" y="168" width="16" height="64" rx="3"/>
    <rect class="te-tube" x="126" y="228" width="64" height="12" rx="4"/>
  </g>
  <path class="te-star" d="M70 70 l5 -14 l5 14 l14 5 l-14 5 l-5 14 l-5 -14 l-14 -5 z"/>
  <circle class="knob" cx="200" cy="268" r="14"/>
</svg>
