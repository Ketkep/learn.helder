<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <style>
    .mp-ball { fill: var(--cover-b); stroke: var(--on-cover); stroke-width: 4; }
    .mp-lit { fill: var(--on-cover); transform-box: fill-box; transform-origin: 50% 50%; }
    .mp-ray { stroke: var(--on-cover); stroke-width: 4; stroke-linecap: round; }
    @media (prefers-reduced-motion: no-preference) {
      :is(a, .head-art):is(:hover, :focus-visible, .is-playing) .mp-lit { animation: mp-wax 2.6s ease-in-out infinite alternate; }
    }
    /* The lit part grows and shrinks like a phase */
    @keyframes mp-wax { 0% { transform: scaleX(0.35); } 100% { transform: scaleX(1); } }
  </style>

  <g>
    <circle class="mp-ball" cx="250" cy="130" r="72"/>
    <path class="mp-lit" d="M250 62A68 68 0 0 0 250 198A38 68 0 0 1 250 62Z"/>
    <line class="mp-ray" x1="56" y1="96" x2="130" y2="96"/>
    <line class="mp-ray" x1="56" y1="130" x2="130" y2="130"/>
    <line class="mp-ray" x1="56" y1="164" x2="130" y2="164"/>
  </g>
  <circle class="knob" cx="200" cy="262" r="14"/>
</svg>
