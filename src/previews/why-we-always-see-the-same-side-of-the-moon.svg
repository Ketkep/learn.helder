<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <style>
    .mf-orbit { fill: none; stroke: var(--on-cover); stroke-width: 4; stroke-dasharray: 3 12; stroke-linecap: round; }
    .mf-earth { fill: var(--on-cover); }
    .mf-moon { fill: var(--cover-b); stroke: var(--on-cover); stroke-width: 7; }
    .mf-dot { fill: var(--on-cover); }
    .mf-go { transform-box: view-box; transform-origin: 200px 130px; }
    @media (prefers-reduced-motion: no-preference) {
      :is(a, .head-art):is(:hover, :focus-visible, .is-playing) .mf-go { animation: mf-round 5s linear infinite; }
    }
    /* The Moon goes round and keeps its marked side towards the Earth */
    @keyframes mf-round { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>

  <g>
    <circle class="mf-orbit" cx="200" cy="130" r="82"/>
    <circle class="mf-earth" cx="200" cy="130" r="26"/>
    <g class="mf-go">
      <circle class="mf-moon" cx="282" cy="130" r="22"/>
      <circle class="mf-dot" cx="268" cy="130" r="6"/>
    </g>
  </g>
  <circle class="knob" cx="200" cy="268" r="14"/>
</svg>
