<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <style>
    .hl-bar { fill: var(--cover-b); stroke: var(--on-cover); stroke-width: 4; }
    .hl-fill { fill: var(--on-cover); transform-box: fill-box; transform-origin: 0 50%; }
    .hl-wave { fill: none; stroke: var(--on-cover); stroke-width: 5; stroke-linecap: round; }
    @media (prefers-reduced-motion: no-preference) {
      :is(a, .head-art):is(:hover, :focus-visible, .is-playing) .hl-fill { animation: hl-fill 2.4s ease-in-out infinite alternate; }
    }
    /* The level rises along the meter */
    @keyframes hl-fill { 0% { transform: scaleX(0.2); } 100% { transform: scaleX(1); } }
  </style>

  <g>
    <rect class="hl-bar" x="70" y="180" width="260" height="36" rx="8"/>
    <rect class="hl-fill" x="76" y="186" width="248" height="24" rx="5"/>
    <path class="hl-wave" d="M96 130C112 90 128 170 144 130S176 90 192 130S224 170 240 130S272 90 288 130"/>
  </g>
  <circle class="knob" cx="200" cy="262" r="14"/>
</svg>
