<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <style>
    .pw-line { fill: none; stroke: var(--on-cover); stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
    .pw-cell { fill: var(--on-cover); opacity: 0.2; }
    @media (prefers-reduced-motion: no-preference) {
      :is(a, .head-art):is(:hover, :focus-visible, .is-playing) .pw-cell { animation: pw-on 3.2s ease-in-out infinite; }
      :is(a, .head-art):is(:hover, :focus-visible, .is-playing) .pw-cell.c2 { animation-delay: 0.3s; }
      :is(a, .head-art):is(:hover, :focus-visible, .is-playing) .pw-cell.c3 { animation-delay: 0.6s; }
      :is(a, .head-art):is(:hover, :focus-visible, .is-playing) .pw-cell.c4 { animation-delay: 0.9s; }
      :is(a, .head-art):is(:hover, :focus-visible, .is-playing) .pw-cell.c5 { animation-delay: 1.2s; }
    }
    /* The places of the password fill in one after another */
    @keyframes pw-on { 0%, 100% { opacity: 0.2; } 30%, 70% { opacity: 1; } }
  </style>

  <g>
    <path class="pw-line" d="M150 120 V92 A50 50 0 0 1 250 92 V120"/>
    <rect class="pw-line" x="120" y="120" width="160" height="100" rx="14"/>
    <rect class="pw-cell c1" x="136" y="154" width="22" height="30" rx="4"/>
    <rect class="pw-cell c2" x="164" y="154" width="22" height="30" rx="4"/>
    <rect class="pw-cell c3" x="192" y="154" width="22" height="30" rx="4"/>
    <rect class="pw-cell c4" x="220" y="154" width="22" height="30" rx="4"/>
    <rect class="pw-cell c5" x="248" y="154" width="22" height="30" rx="4"/>
  </g>
  <circle class="knob" cx="200" cy="268" r="14"/>
</svg>
