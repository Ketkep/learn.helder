<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <style>
    .hg-box { fill: var(--cover-b); stroke: var(--on-cover); stroke-width: 4; }
    .hg-line { fill: none; stroke: var(--on-cover); stroke-width: 5; stroke-linecap: round; }
    .hg-flat { fill: none; stroke: var(--on-cover); stroke-width: 4; stroke-dasharray: 3 9; stroke-linecap: round; }
    .hg-coin { fill: var(--cover); stroke: var(--on-cover); stroke-width: 4; transform-box: fill-box; transform-origin: 50% 100%; }
    @media (prefers-reduced-motion: no-preference) {
      :is(a, .head-art):is(:hover, :focus-visible, .is-playing) .hg-coin { animation: hg-grow 2.4s ease-in-out infinite alternate; }
    }
    /* The last coin swells, as growth lands on top of growth */
    @keyframes hg-grow { 0% { transform: scale(0.6); } 100% { transform: scale(1.3); } }
  </style>

  <g>
    <rect class="hg-box" x="70" y="56" width="260" height="170" rx="10"/>
    <path class="hg-flat" d="M92 200L308 140"/>
    <path class="hg-line" d="M92 204C160 200 230 180 308 86"/>
    <circle class="hg-coin" cx="308" cy="86" r="13"/>
  </g>
  <circle class="knob" cx="200" cy="264" r="14"/>
</svg>
