<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <style>
    .hc-die { fill: var(--on-cover); }
    .hc-pip { fill: var(--cover); }
    .hc-bar { fill: var(--on-cover); opacity: 0.85; }
    .hc-tumble { transform-box: fill-box; transform-origin: 50% 50%; }
    @media (prefers-reduced-motion: no-preference) {
      :is(a, .head-art):is(:hover, :focus-visible, .is-playing) .hc-a { animation: hc-roll 3s ease-in-out infinite; }
      :is(a, .head-art):is(:hover, :focus-visible, .is-playing) .hc-b { animation: hc-roll 3s ease-in-out -1.1s infinite; }
    }
    /* The two dice tumble and settle again and again */
    @keyframes hc-roll { 0%, 20% { transform: rotate(0deg) translateY(0); } 40% { transform: rotate(120deg) translateY(-26px); } 60% { transform: rotate(240deg) translateY(0); } 80%, 100% { transform: rotate(360deg) translateY(0); } }
  </style>

  <!-- A little histogram under the dice: the totals pile up around 7 -->
  <g>
    <rect class="hc-bar" x="60" y="244" width="22" height="16"/>
    <rect class="hc-bar" x="88" y="228" width="22" height="32"/>
    <rect class="hc-bar" x="116" y="208" width="22" height="52"/>
    <rect class="hc-bar" x="144" y="190" width="22" height="70"/>
    <rect class="hc-bar" x="172" y="172" width="22" height="88"/>
    <rect class="hc-bar" x="200" y="156" width="22" height="104"/>
    <rect class="hc-bar" x="228" y="172" width="22" height="88"/>
    <rect class="hc-bar" x="256" y="190" width="22" height="70"/>
    <rect class="hc-bar" x="284" y="208" width="22" height="52"/>
    <rect class="hc-bar" x="312" y="228" width="22" height="32"/>
    <rect class="hc-bar" x="340" y="244" width="22" height="16"/>
  </g>
  <g class="hc-tumble hc-a">
    <rect class="hc-die" x="104" y="52" width="76" height="76" rx="14"/>
    <circle class="hc-pip" cx="124" cy="72" r="7"/><circle class="hc-pip" cx="160" cy="72" r="7"/><circle class="hc-pip" cx="142" cy="90" r="7"/><circle class="hc-pip" cx="124" cy="108" r="7"/><circle class="hc-pip" cx="160" cy="108" r="7"/>
  </g>
  <g class="hc-tumble hc-b">
    <rect class="hc-die" x="212" y="52" width="76" height="76" rx="14"/>
    <circle class="hc-pip" cx="232" cy="72" r="7"/><circle class="hc-pip" cx="268" cy="72" r="7"/><circle class="hc-pip" cx="232" cy="90" r="7"/><circle class="hc-pip" cx="268" cy="90" r="7"/><circle class="hc-pip" cx="232" cy="108" r="7"/><circle class="hc-pip" cx="268" cy="108" r="7"/>
  </g>
  <circle class="knob" cx="200" cy="148" r="12"/>
</svg>
