<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <style>
    .cp-ring { fill: none; stroke: var(--on-cover); stroke-width: 9; }
    .cp-tick { stroke: var(--on-cover); stroke-width: 6; stroke-linecap: round; }
    .cp-needle { transform-box: view-box; transform-origin: 200px 130px; }
    .cp-n { fill: var(--on-cover); }
    .cp-s { fill: var(--cover-b); stroke: var(--on-cover); stroke-width: 6; stroke-linejoin: round; }
    @media (prefers-reduced-motion: no-preference) {
      :is(a, .head-art):is(:hover, :focus-visible, .is-playing) .cp-needle { animation: cp-swing 2.2s ease-in-out infinite alternate; }
    }
    /* The needle swings and settles around north */
    @keyframes cp-swing { 0% { transform: rotate(-24deg); } 100% { transform: rotate(16deg); } }
  </style>

  <g>
    <circle class="cp-ring" cx="200" cy="130" r="92"/>
    <path class="cp-tick" d="M200 38 V54 M200 206 V222 M108 130 H124 M276 130 H292"/>
    <g class="cp-needle">
      <path class="cp-n" d="M200 62 L218 130 L182 130 Z"/>
      <path class="cp-s" d="M200 198 L218 130 L182 130 Z"/>
    </g>
    <circle class="cp-n" cx="200" cy="130" r="8"/>
  </g>
  <circle class="knob" cx="200" cy="268" r="14"/>
</svg>
