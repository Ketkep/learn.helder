<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <style>
    .mu-thin { stroke: var(--on-cover); stroke-width: 7; stroke-linecap: round; }
    .mu-thick { fill: var(--on-cover); }
    .mu-z { stroke: var(--on-cover); stroke-width: 7; }
    .mu-slide { transform-box: fill-box; }
    @media (prefers-reduced-motion: no-preference) {
      :is(a, .head-art):is(:hover, :focus-visible, .is-playing) .mu-slide { animation: mu-pull 1.8s ease-in-out infinite; }
    }
    /* The thin filaments slide in and the sarcomere shortens */
    @keyframes mu-pull { 0%, 15% { transform: translateX(0); } 55%, 100% { transform: translateX(26px); } }
  </style>

  <g>
    <line class="mu-z" x1="70" y1="80" x2="70" y2="200"/>
    <line class="mu-z" x1="330" y1="80" x2="330" y2="200"/>
    <rect class="mu-thick" x="110" y="132" width="180" height="26" rx="10"/>
    <line class="mu-thin mu-slide" x1="70" y1="105" x2="190" y2="105"/>
    <line class="mu-thin mu-slide" x1="70" y1="185" x2="190" y2="185"/>
  </g>
  <circle class="knob" cx="200" cy="268" r="14"/>
</svg>
